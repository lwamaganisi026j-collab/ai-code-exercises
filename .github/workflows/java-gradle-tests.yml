name: Java Gradle Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gradle-tests:
    name: Gradle tests - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - use-cases/code-algorithms/java/TaskManager
          - use-cases/code-comprehension-001/java/TaskManager
          - use-cases/debug-errors-001/java
          - use-cases/debug-performance/java/ImageProcessor
          - use-cases/refactor-functions/java
          - use-cases/testing-001/java/TaskManager
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew test
      - name: Build
        run: ./gradlew build
